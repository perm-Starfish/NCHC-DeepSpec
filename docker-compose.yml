services:
  deepspec:
    build:
      context: .
      dockerfile: Dockerfile

    image: deepspec:cuda12.2
    container_name: deepspec-dev

    working_dir: /workspace/DeepSpec

    stdin_open: true
    tty: true

    ipc: host
    shm_size: "32gb"

    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    volumes:
      - .:/workspace/DeepSpec

    environment:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    command: /bin/bash
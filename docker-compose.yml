services:
  deepspec:
    user: "${LOCAL_UID}:${LOCAL_GID}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID}
        LOCAL_GID: ${LOCAL_GID}

    image: deepspec:cuda12.2
    container_name: deepspec-dev

    dns:
      - 8.8.8.8
      - 1.1.1.1

    working_dir: /workspace/DeepSpec

    stdin_open: true
    tty: true

    ipc: host
    shm_size: "32gb"

    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    volumes:
      - .:/workspace/DeepSpec
      - /data:/data

    # allow the container to access services running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"

      DEEPSPEC_CACHE_DIR: /data/deepspec_cache
      DEEPSPEC_TENSORBOARD_DIR: /data/tensorboard
      DEEPSPEC_CHECKPOINT_DIR: /data/checkpoints
      HF_HOME: /data/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    command: /bin/bash

  vllm0:
    image: vllm/vllm-openai:v0.8.5
    container_name: vllm-gpu0

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ipc: host
    restart: unless-stopped

    command: >
      --model Qwen/Qwen3-4B
      --host 0.0.0.0
      --port 30000
      --dtype half
      --max-model-len 4096

    ports:
      - "30000:30000"

    volumes:
      - /data/huggingface:/root/.cache/huggingface

    environment:
      HF_HOME: /root/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  vllm1:
    image: vllm/vllm-openai:v0.8.5
    container_name: vllm-gpu1

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ipc: host
    restart: unless-stopped

    command: >
      --model Qwen/Qwen3-4B
      --host 0.0.0.0
      --port 30001
      --dtype half
      --max-model-len 4096

    ports:
      - "30001:30001"

    volumes:
      - /data/huggingface:/root/.cache/huggingface

    environment:
      HF_HOME: /root/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]